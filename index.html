<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dino Run</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overflow: hidden; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px;
    padding: 50px 10px 10px; box-sizing: border-box; position: relative; overflow-y: auto; }
  .bezel { width: min(80vw, 42vh, 380px); aspect-ratio: 1; border-radius: 50%; padding: 10px; background: #1d3a8a;
    box-shadow: 0 0 0 4px #0b1d4f, 0 10px 30px rgba(0,0,0,.6); box-sizing: border-box; flex: none; }
  canvas { width: 100%; height: 100%; border-radius: 50%; display: block; background: #000; }
  .pad { display: flex; gap: 16px; width: min(92vw, 420px); flex: none; }
  .btn { flex: 1; height: 80px; border-radius: 22px; border: none; font-size: 22px; font-weight: 700; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; touch-action: none; font-family: inherit; }
  .btn small { font-size: 13px; font-weight: 500; opacity: .85; }
  #jump { background: #7c3aed; box-shadow: 0 6px 0 #4c1d95; }
  #duck { background: #334155; box-shadow: 0 6px 0 #1e293b; }
  .btn.on { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.5); }
  #panel { width: min(92vw, 420px); display: flex; flex-direction: column; gap: 10px; flex: none; }
  .big { height: 56px; border-radius: 16px; border: none; font-size: 18px; font-weight: 700; color: #fff; font-family: inherit; }
  .solo { background: #7c3aed; } .duo { background: #ea7a1a; } .ghost { background: #2a3245; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  input { height: 50px; border-radius: 14px; border: 2px solid #3a445c; background: #1b2132; color: #fff; font-size: 18px;
    padding: 0 12px; box-sizing: border-box; font-family: inherit; text-align: center; min-width: 0; -webkit-user-select: text; user-select: text; }
  .card { background: #1b2132; border-radius: 14px; padding: 10px 12px; font-size: 15px; line-height: 1.5; }
  .code { text-align: center; }
  .code b { font-size: 26px; letter-spacing: 4px; color: #ffd200; direction: ltr; display: inline-block; }
  .note { font-size: 13px; opacity: .7; text-align: center; line-height: 1.5; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { padding: 5px 4px; text-align: right; }
  th { font-size: 12px; opacity: .6; font-weight: 500; }
  td.n { text-align: center; direction: ltr; }
  tr.me td { color: #ffd200; font-weight: 700; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
  h3 { margin: 0 0 6px; font-size: 16px; }
  #back { position: absolute; top: 10px; right: 10px; height: 36px; padding: 0 14px; border-radius: 18px; border: none;
    background: #2a3245; color: #fff; font-size: 14px; font-family: inherit; z-index: 2; }
  .chars { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { flex: 1; min-width: 62px; height: 46px; border-radius: 12px; border: 2px solid transparent; background: #2a3245; color: #fff; font-size: 14px; font-family: inherit; }
  .chip.sel { border-color: #ffd200; background: #3a3420; }
  .colors { display: flex; gap: 9px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
  .sw.sel { border-color: #fff; box-shadow: 0 0 0 2px #000 inset; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <button id="back" class="hidden">→ תפריט</button>
  <div class="bezel"><canvas id="c" width="240" height="240"></canvas></div>
  <div class="pad hidden" id="pad">
    <button class="btn" id="duck">⬇<small>התכופפות</small></button>
    <button class="btn" id="jump">⬆<small id="jumpLabel">קפיצה</small></button>
  </div>
  <div id="panel"></div>
</div>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const CX = 120, CY = 120, GROUND = 165, DX = 40, MAX_LEVEL = 10;
const $ = id => document.getElementById(id);
// older phones don't have roundRect: without this the game freezes on them
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

// ---- level settings ----
const levelSpeed   = lv => Math.min(3 + (lv - 1) * 0.5, 7.5);
const levelGoal    = lv => 6 + lv * 2;
const levelTypes   = lv => Math.min(lv, 5);
const levelGapRand = lv => Math.max(30, 130 - lv * 10);
const raceLen      = lv => 1200 + lv * 400;         // race: track length per level
const STUN_MS = 700;                                // race: how long a hit freezes you
const POINTS = [10, 8, 6, 5, 4, 3, 2, 1];           // race: points by finishing place
const FINISH_WAIT_MS = 15000;                       // race: level ends this long after the first finisher
const MAX_PLAYERS = 8;
const COLORS = ['#9650dc', '#f08a24', '#2bb3c0', '#e0457b', '#5cbf3a', '#3a6fe0', '#d4b106', '#a1887f'];
const CHARS = [ { id: 'dino', emoji: '🦖', name: 'דינו' }, { id: 'robot', emoji: '🤖', name: 'רובוט' }, { id: 'penguin', emoji: '🐧', name: 'פינגווין' },
                { id: 'cat', emoji: '🐱', name: 'חתול' }, { id: 'frog', emoji: '🐸', name: 'צפרדע' },
                { id: 'princess', emoji: '👸', name: 'נסיכה' }, { id: 'unicorn', emoji: '🦄', name: 'חד-קרן' }, { id: 'ninja', emoji: '🥷', name: 'נינג׳ה' } ];
const charEmoji = id => (CHARS.find(c => c.id === id) || CHARS[0]).emoji;
function loadPref(k, ok, def) { try { const v = localStorage.getItem(k); return ok(v) ? v : def; } catch (e) { return def; } }
function savePref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let selChar = loadPref('dino-char', v => CHARS.some(c => c.id === v), 'dino');
let selColor = loadPref('dino-color', v => COLORS.includes(v), COLORS[0]);

const THEMES = [
  { sky:'#78bef0', sand:'#e6c882', speck:'#b4965a', text:'#141e3c', cloud:'#ffffff' },
  { sky:'#fa8c50', sand:'#c88246', speck:'#965a32', text:'#32141e', cloud:'#ffc8aa' },
  { sky:'#463278', sand:'#966e5a', speck:'#64463c', text:'#ffffff', cloud:'#6e5aa0' },
  { sky:'#0a0f28', sand:'#46465a', speck:'#28283c', text:'#ffffff', cloud:'#283250' },
  { sky:'#3c0a0a', sand:'#782814', speck:'#dc5a14', text:'#ffe6c8', cloud:'#641e1e' },
];
const C = { dino:'#9650dc', eye:'#fff', cactus:'#28963c', bird:'#d23c46', heart:'#ff3250', gold:'#ffd200', silver:'#c8cdd8', bronze:'#d08a4a', dim:'#505050' };
let T = THEMES[0];

const CAC_S = 0, CAC_L = 1, CAC_D = 2, BIRD_LOW = 3, BIRD_HIGH = 4;
const obWidth = t => t === CAC_S ? 10 : t === CAC_L ? 14 : t === CAC_D ? 26 : 22;
function obBox(o) {
  const x0 = o.x, x1 = o.x + obWidth(o.type);
  const y = { [CAC_S]:[GROUND-22,GROUND], [CAC_L]:[GROUND-34,GROUND], [CAC_D]:[GROUND-22,GROUND],
              [BIRD_LOW]:[GROUND-18,GROUND-6], [BIRD_HIGH]:[GROUND-38,GROUND-24] }[o.type];
  return [x0, y[0], x1, y[1]];
}

// ---- shared state ----
let mode = 'menu';           // 'menu' | 'solo' | 'race'
let state = 'IDLE';
let level = 1, lives = 3, cleared = 0, spawned = 0, speed = levelSpeed(1);
let dinoY = GROUND, vy = 0, onGround = true, ducking = false, nextGap = 0;
let stateTime = 0, invulnUntil = 0, now = 0;
let obs = [];
let input = { jump: false, duck: false }, jumpEdge = false;
const rnd = (a, b) => a + (b - a) * Math.random();
const clouds = [0,1,2].map(() => [rnd(0,240), rnd(55,110)]);
const specks = Array.from({length:24}, () => [Math.random()*240, GROUND + 4 + Math.random()*24]);

function setState(s) { state = s; stateTime = now; }
function resetRun() {
  if (typeof myFin !== 'undefined') { myFin = false; myFt = 0; d = 0; }
  speed = levelSpeed(level); T = THEMES[(level - 1) % 5];
  cleared = 0; spawned = 0; obs = []; dinoY = GROUND; vy = 0; onGround = true; ducking = false; nextGap = 0;
}
function startLevel(lv) { level = lv; resetRun(); setState('INTRO'); }

// ---- drawing helpers ----
function rr(x, y, w, h, r, col) { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); }
function rect(x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function tri(a, b, c, d, e, f, col) { g.fillStyle = col; g.beginPath(); g.moveTo(a,b); g.lineTo(c,d); g.lineTo(e,f); g.fill(); }
function circ(x, y, r, col) { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill(); }
function htext(s, y, px, col, x = CX) {
  g.fillStyle = col; g.font = `bold ${px}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'top';
  g.fillText(s, x, y);
}
function text(s, y, size, col, x = CX, align = 'center') {
  g.fillStyle = col; g.font = `bold ${size * 8}px monospace`; g.textAlign = align; g.textBaseline = 'top';
  g.fillText(s, x, y);
}
function dinoShape(x, b, duck, col, legA) {
  if (!duck) {
    tri(x, b-20, x+9, b-24, x+9, b-12, col);
    rr(x+6, b-25, 18, 17, 5, col);
    rr(x+16, b-36, 17, 13, 4, col);
    rect(x+26, b-33, 3, 3, C.eye);
    rect(x+25, b-26, 7, 1, C.eye);
    rect(x+22, b-17, 5, 2, col);
    rect(x+9, b-9, 4, legA ? 9 : 5, col);
    rect(x+17, b-9, 4, legA ? 5 : 9, col);
  } else {
    tri(x, b-12, x+6, b-14, x+6, b-8, col);
    rr(x+4, b-15, 24, 11, 5, col);
    rr(x+22, b-19, 15, 11, 4, col);
    rect(x+31, b-17, 3, 3, C.eye);
    rect(x+9, b-5, 4, legA ? 5 : 3, col);
    rect(x+18, b-5, 4, legA ? 3 : 5, col);
  }
}
// All characters share the same size and hitbox, so nobody gets an advantage.
function robotShape(x, b, duck, col, legA) {
  const metal = '#555', visor = '#7ff';
  if (!duck) {
    rect(x+11, b-8, 4, legA ? 8 : 5, metal); rect(x+21, b-8, 4, legA ? 5 : 8, metal);
    rr(x+8, b-24, 22, 16, 3, col); rect(x+13, b-20, 8, 6, 'rgba(255,255,255,.35)');
    rr(x+12, b-37, 20, 13, 3, col); rect(x+21, b-33, 9, 4, visor);
    rect(x+21, b-42, 2, 5, metal); circ(x+22, b-43, 2, C.heart);
    rect(x+29, b-20, 6, 3, col);
  } else {
    rr(x+4, b-15, 26, 11, 3, col); rr(x+24, b-19, 14, 11, 3, col); rect(x+30, b-16, 7, 3, visor);
    rect(x+8, b-4, 4, legA ? 4 : 3, metal); rect(x+20, b-4, 4, legA ? 3 : 4, metal);
  }
}
function penguinShape(x, b, duck, col, legA) {
  const beak = '#f5a623';
  if (!duck) {
    rr(x+9, b-36, 20, 33, 10, col); rr(x+15, b-29, 13, 24, 6, '#fff');
    circ(x+23, b-31, 2.5, '#fff'); rect(x+23, b-32, 2, 2, '#111');
    tri(x+28, b-30, x+28, b-26, x+35, b-28, beak);
    rect(x + (legA ? 12 : 14), b-3, 6, 3, beak); rect(x + (legA ? 22 : 20), b-3, 6, 3, beak);
  } else {
    rr(x+3, b-16, 32, 13, 6, col); rr(x+7, b-9, 25, 6, 3, '#fff');
    circ(x+28, b-12, 2, '#fff'); rect(x+28, b-13, 1, 1, '#111');
    tri(x+34, b-13, x+34, b-9, x+39, b-11, beak);
  }
}
function catShape(x, b, duck, col, legA) {
  if (!duck) {
    rr(x+1, b-34, 4, 16, 2, col);
    rr(x+5, b-22, 22, 13, 6, col);
    circ(x+27, b-27, 8, col);
    tri(x+21, b-32, x+23, b-39, x+27, b-33, col); tri(x+28, b-33, x+32, b-39, x+34, b-30, col);
    rect(x+28, b-29, 3, 3, '#fff'); rect(x+29, b-28, 2, 2, '#111'); rect(x+33, b-26, 2, 2, '#f9a');
    rect(x+8, b-9, 3, legA ? 9 : 6, col); rect(x+15, b-9, 3, legA ? 6 : 9, col); rect(x+21, b-9, 3, legA ? 9 : 6, col);
  } else {
    rr(x, b-14, 10, 3, 1, col); rr(x+5, b-12, 24, 9, 4, col); circ(x+31, b-11, 6, col);
    tri(x+27, b-15, x+29, b-20, x+31, b-15, col); tri(x+31, b-15, x+34, b-20, x+36, b-13, col);
    rect(x+32, b-13, 2, 2, '#fff');
    rect(x+9, b-3, 3, 3, col); rect(x+21, b-3, 3, 3, col);
  }
}
function frogShape(x, b, duck, col, legA) {
  const eye = (cx, cy, r) => { circ(cx, cy, r, col); circ(cx + 1, cy - 1, r - 2, '#fff'); rect(cx + 1, cy - 2, 2, 2, '#111'); };
  if (!duck) {
    rr(x+5, b-10, 11, 8, 4, col);
    rr(x+8, b-26, 22, 20, 8, col); rr(x+12, b-18, 12, 10, 4, 'rgba(255,255,255,.35)');
    eye(x+19, b-29, 5); eye(x+27, b-29, 5);
    rect(x+20, b-17, 10, 1, '#111');
    rect(x + (legA ? 24 : 22), b-6, 7, 6, col);
  } else {
    rr(x+4, b-14, 30, 12, 6, col); eye(x+22, b-14, 4); eye(x+29, b-14, 4);
    rect(x+26, b-7, 7, 1, '#111');
    rect(x+4, b-4, 8, 4, col); rect(x+26, b-4, 8, 4, col);
  }
}
const SKIN = '#f5d0a9';
function princessShape(x, b, duck, col, legA) {
  const hair = '#f4c430', crown = C.gold;
  if (!duck) {
    rr(x+12, b-37, 9, 18, 4, hair);                                  // hair behind
    tri(x+19, b-24, x+7, b-3, x+31, b-3, col);                       // dress
    rr(x+14, b-26, 11, 9, 3, col);                                   // bodice
    rect(x+23, b-22, 7, 2, SKIN);                                    // arm
    rect(x + (legA ? 14 : 16), b-3, 4, 3, '#333'); rect(x + (legA ? 22 : 20), b-3, 4, 3, '#333');
    circ(x+21, b-31, 6, SKIN);                                       // head
    rect(x+15, b-37, 11, 3, hair);                                   // fringe
    rect(x+15, b-40, 11, 3, crown);                                  // crown
    tri(x+15, b-40, x+16, b-44, x+18, b-40, crown); tri(x+19, b-40, x+20.5, b-45, x+22, b-40, crown); tri(x+23, b-40, x+25, b-44, x+26, b-40, crown);
    circ(x+20.5, b-41, 1, C.heart);
    rect(x+23, b-32, 2, 2, '#111'); rect(x+23, b-28, 3, 1, '#c0392b');
  } else {
    rr(x+21, b-19, 8, 11, 3, hair);
    rr(x+3, b-12, 27, 10, 5, col);
    circ(x+30, b-12, 6, SKIN);
    rect(x+26, b-20, 9, 2, crown); tri(x+26, b-20, x+27, b-23, x+29, b-20, crown); tri(x+30, b-20, x+31, b-24, x+33, b-20, crown);
    rect(x+32, b-14, 2, 2, '#111');
  }
}
function unicornShape(x, b, duck, col, legA) {
  const mane = '#ff7eb6';
  if (!duck) {
    rr(x, b-23, 6, 11, 3, mane);                                     // tail
    rr(x+4, b-22, 22, 12, 5, col);                                   // body
    rect(x+7, b-11, 3, legA ? 11 : 8, col); rect(x+12, b-11, 3, legA ? 8 : 11, col);
    rect(x+19, b-11, 3, legA ? 11 : 8, col); rect(x+23, b-11, 3, legA ? 8 : 11, col);
    rr(x+20, b-33, 9, 16, 4, col);                                   // neck
    rr(x+24, b-33, 12, 8, 3, col);                                   // head
    rr(x+18, b-34, 4, 14, 2, mane);                                  // mane
    tri(x+26, b-33, x+29, b-33, x+30, b-43, C.gold);                 // horn
    rect(x+29, b-31, 2, 2, '#111');
  } else {
    rr(x, b-12, 6, 6, 3, mane);
    rr(x+3, b-13, 24, 10, 4, col);
    rr(x+24, b-17, 13, 8, 3, col);
    rr(x+22, b-18, 4, 9, 2, mane);
    tri(x+31, b-17, x+34, b-17, x+39, b-23, C.gold);
    rect(x+32, b-15, 2, 2, '#111');
    rect(x+6, b-3, 4, 3, col); rect(x+20, b-3, 4, 3, col);
  }
}
function ninjaShape(x, b, duck, col, legA) {
  const band = C.heart;
  if (!duck) {
    rect(x+8, b-33, 7, 2, band); rect(x+6, b-31, 5, 2, band);        // headband tails
    rect(x+12, b-9, 4, legA ? 9 : 6, col); rect(x+20, b-9, 4, legA ? 6 : 9, col);
    rr(x+10, b-25, 16, 16, 4, col);
    rect(x+10, b-16, 16, 2, band);                                   // belt
    rect(x+25, b-22, 8, 3, col);                                     // arm
    circ(x+20, b-31, 7, col);
    rect(x+17, b-33, 11, 4, SKIN); rect(x+23, b-32, 2, 2, '#111');   // eye slit
    rect(x+14, b-37, 12, 2, band);
  } else {
    rect(x+14, b-16, 6, 2, band);
    rr(x+6, b-15, 22, 11, 5, col);
    circ(x+29, b-12, 6, col);
    rect(x+26, b-14, 9, 3, SKIN); rect(x+31, b-14, 2, 2, '#111');
    rect(x+9, b-4, 4, 4, col); rect(x+20, b-4, 4, 4, col);
  }
}
function charShape(kind, x, b, duck, col, legA) {
  if (kind === 'robot') robotShape(x, b, duck, col, legA);
  else if (kind === 'penguin') penguinShape(x, b, duck, col, legA);
  else if (kind === 'cat') catShape(x, b, duck, col, legA);
  else if (kind === 'frog') frogShape(x, b, duck, col, legA);
  else if (kind === 'princess') princessShape(x, b, duck, col, legA);
  else if (kind === 'unicorn') unicornShape(x, b, duck, col, legA);
  else if (kind === 'ninja') ninjaShape(x, b, duck, col, legA);
  else dinoShape(x, b, duck, col, legA);
}
function drawDino(duck, col = selColor, running = true) { charShape(selChar, DX, Math.round(dinoY), duck, col, running && onGround && Math.floor(now / 90) % 2); }
function drawCactus(cx, h) {
  const top = GROUND - h;
  rr(cx-3, top, 6, h, 3, C.cactus);
  rr(cx-7, top+7, 3, 8, 1, C.cactus); rect(cx-7, top+13, 5, 3, C.cactus);
  rr(cx+4, top+4, 3, 8, 1, C.cactus); rect(cx+2, top+10, 5, 3, C.cactus);
}
function drawBird(x, top) {
  tri(x, top+4, x+6, top+6, x, top+10, C.bird);
  rr(x+4, top+4, 14, 7, 3, C.bird);
  circ(x+19, top+6, 4, C.bird);
  tri(x+22, top+4, x+22, top+8, x+27, top+6, C.gold);
  rect(x+19, top+4, 2, 2, C.eye);
  if (Math.floor(now / 150) % 2) tri(x+7, top+6, x+15, top+6, x+10, top-5, C.bird);
  else tri(x+7, top+9, x+15, top+9, x+10, top+18, C.bird);
}
function drawObstacle(o) {
  const x = Math.round(o.x);
  if (o.type === CAC_S) drawCactus(x+5, 22);
  else if (o.type === CAC_L) drawCactus(x+7, 34);
  else if (o.type === CAC_D) { drawCactus(x+6, 22); drawCactus(x+20, 18); }
  else if (o.type === BIRD_LOW) drawBird(x, GROUND-18);
  else drawBird(x, GROUND-38);
}
function drawWorld(moveBy) {
  rect(0, 0, 240, 240, T.sky);
  for (const c of clouds) {
    c[0] -= moveBy * 0.25; if (c[0] < -30) { c[0] = 260; c[1] = rnd(55, 110); }
    rr(c[0], c[1], 28, 9, 4, T.cloud); rr(c[0]+7, c[1]-5, 14, 9, 4, T.cloud);
  }
  rect(0, GROUND, 240, 240 - GROUND, T.sand);

  racers.sort((a, b) => (a.fin && b.fin) ? a.ft - b.ft : a.fin ? -1 : b.fin ? 1 : b.d - a.d);
  return { place: racers.findIndex(p => p.id === myId) + 1, of: racers.length };
}

function raceTick(edge) {
  const blink = Math.floor(now / 500) % 2;

      if (isHost) {

      break;
    }
    case 'RCOUNT': {
      drawWorld(0); drawDino(false, myColor);
      const left = 3 - Math.floor((now - stateTime) / 1000);
      text('LEVEL ' + level, 40, 2, T.text);
      text(String(Math.max(left, 1)), 70, 6, C.gold);
      if (left <= 0) { phase = 'race'; raceStart = now; invulnUntil = now + 600; setState('RRACE'); }
      break;
    }
    case 'RRACE': case 'RDONE': {
      const running = !myFin && now >= stunUntil;
      if (!myFin) {
        const wasOnGround = onGround;
        physics();
        if (running) d += speed;
        const st = myStats || (myStats = newStats());

        if (!onGround) { st.air += 28; st.maxH = Math.max(st.maxH, Math.round(GROUND - dinoY)); }
        if (ducking) st.duck += 28;
        for (const o of obs) {
          o.x = DX + (o.p - d);
          if (!o.passed) {                                   // how close did I get? (for "על הקשקש")
            const [x0, y0, x1, y1] = obBox(o);
            if (DX + 30 > x0 && DX + 8 < x1) {
              const gap = o.type === BIRD_HIGH ? (dinoY - (ducking ? 16 : 32)) - y1 : y0 - dinoY;
              o.minGap = Math.min(o.minGap === undefined ? 99 : o.minGap, gap);
            }
          }
          if (!o.passed && o.x + obWidth(o.type) < DX) {
            o.passed = true; st.streak++; st.best = Math.max(st.best, st.streak);
            if (o.minGap !== undefined && o.minGap < 8) st.shave++;
          }
          if (now > invulnUntil && !o.passed && hitTest(o)) { o.passed = true; st.hits++; st.streak = 0; stunUntil = now + STUN_MS; invulnUntil = now + STUN_MS + 600; }
        }
        if (d >= course.L) { d = course.L; myFin = true; myFt = now - raceStart; dinoY = GROUND; onGround = true; if (m) { m.fin = true; m.ft = myFt; } if (isHost && !firstFinishAt) firstFinishAt = now; setState('RDONE'); }
      } else for (const o of obs) o.x = DX + (o.p - d);

      drawWorld(running ? speed : 0);
      drawFlag(DX + (course.L - d) + 34);
      for (const o of obs) if (o.x > -30 && o.x < 250) drawObstacle(o);
      // other players as see-through ghosts
      g.globalAlpha = 0.5;
      for (const p of Object.values(players)) {
        if (p.id === myId || !p.inRace) continue;
        const sx = DX + ((p.fin ? course.L : p.d) - d);
        if (sx > -40 && sx < 245) charShape(p.char, sx, Math.round(p.y || GROUND), !!p.duck, p.color, !p.fin && Math.floor(now / 90) % 2);
      }

      if (!(now < invulnUntil && Math.floor(now / 100) % 2)) drawDino(ducking, myColor, running);

      // progress bar with everyone

      for (const p of Object.values(players)) if (p.inRace && p.id !== myId) circ(mx0 + (mx1 - mx0) * Math.min((p.fin ? course.L : p.d) / course.L, 1), my + 1, 4, p.color);
      circ(mx0 + (mx1 - mx0) * Math.min(d / course.L, 1), my + 1, 6, myColor);

          htext(a.name, 116, 18, T.text);

      }

      const medal = [C.gold, C.silver, C.bronze];
      rows.forEach((r, i) => {

        text(nm, 56 + i * 24, 2, p ? p.color : T.text, 66, 'left');
      });
      if (!rows.length) text('NOBODY FINISHED', 70, 1, T.text);
      text('NEXT LEVEL SOON', 140, 1, T.text);
      if (isHost && now - stateTime > 6000) hostStartLevel(level + 1);
      break;
    }
    case 'RFINAL': {
      dinoY = GROUND; vy = 0; onGround = true;
      drawWorld(speed * 0.5); drawDino(false, myColor);
      if (familyMode) {
        htext('🎉 כולם ניצחו! 🎉', 34, 20, C.gold);
        const mine = me();
        if (mine) { htext('אספת ' + (mine.awards || []).length + ' פרסים', 66, 16, T.text); htext(awardSummary(mine.awards).slice(0, 24), 92, 16, '#000'); }
        if (isHost) { if (blink) text('JUMP = NEW GAME', 130, 1, T.text); if (edge && now - stateTime > 1500) hostNewGame(); }
        else htext('הטבלה למטה', 130, 13, T.text);
        break;
      }
      const top = standings()[0];
      text('WINNER', 30, 3, C.gold);
      if (top) { text((top.name || 'PLAYER').toUpperCase(), 62, 2, top.color); text(top.pts + ' POINTS', 86, 1, T.text); }
      if (isHost) { if (blink) text('JUMP = NEW GAME', 130, 1, T.text); if (edge && now - stateTime > 1500) hostNewGame(); }
      else text('SEE TABLE BELOW', 130, 1, T.text);
      break;
    }
    case 'RRECONN':
      dinoY = GROUND; vy = 0; onGround = true;
      drawWorld(0); drawDino(false, myColor, false);
      text('RECONNECTING' + '.'.repeat(1 + Math.floor(now / 400) % 3), 60, 2, C.gold, CX - 64, 'left');
      text('ROOM ' + code.toUpperCase(), 90, code.length > 6 ? 1 : 2, T.text);
      text('YOUR POINTS ARE KEPT', 120, 1, T.text);
      break;
    case 'RCLOSED':
      dinoY = GROUND; vy = 0; onGround = true;
      drawWorld(0); drawDino(false, myColor, false);
      text('ROOM', 60, 3, C.heart); text('CLOSED', 90, 3, C.heart);
      if (blink) text('PRESS JUMP FOR MENU', 135, 1, T.text);
      if (edge && now - stateTime > 800) { disconnect(); renderMenu(); }
      break;
  }

  // guests: say so when the host stopped answering (host switched app / locked the screen)
  if (!isHost && state !== 'RRECONN' && state !== 'RCLOSED' && performance.now() - lastHostMsg > 4000) {
    rect(0, 196, 240, 30, 'rgba(0,0,0,.7)');
    text('HOST NOT RESPONDING', 200, 1, C.gold); text('HOST MUST KEEP THE GAME OPEN', 212, 1, '#fff');
  }

  // network: ~10 updates per second
  if (now - sendT >= 100) {
    sendT = now;
    if (isHost) {
      const p = {};
      for (const q of Object.values(players)) if (q.online !== false) p[q.id] = { d: Math.round(q.d), y: Math.round(q.y), duck: q.duck, fin: q.fin, ft: q.ft };
      if (guestConns.size) broadcast({ t: 'st', p });
      // a guest that went silent (closed the app, lost signal): let it go, it can come back
      for (const [id, c] of guestConns) { const q = players[id]; if (q && now - q.seen > 10000) { try { c.close(); } catch (e) {} guestConns.delete(id); q.online = false; q.inRace = false; sendRoster(); } }
      if (now - roomSendT > 3000) { roomSendT = now; broadcast(rosterMsg()); }
    } else if (hostConn && hostConn.open) {
      sendTo(hostConn, { t: 'st', rid: raceId, s: myStats, lv: level, d: Math.round(d), y: Math.round(dinoY), duck: ducking, fin: myFin, ft: myFt });
    }
  }
}
function hostNewGame() {
  for (const p of Object.values(players)) Object.assign(p, { pts: 0, p1: 0, p2: 0, p3: 0, awards: [], inRace: false, fin: false, d: 0 });
  completed = 0; level = 1; resetRun(); phase = 'lobby'; lastResults = null; setState('RLOBBY'); sendRoster();
}

// ---- connect ----
function connect(c, host, id) {
  return new Promise(resolve => {
    if (typeof Peer === 'undefined') { resolve('nolib'); return; }
    code = c; isHost = host; myId = id; leaving = false; roomClosed = false;
    let done = false, wait = null;
    const finish = r => { if (!done) { done = true; clearInterval(wait); resolve(r); } };
    const pe = host ? new Peer(PEER_PREFIX + code) : new Peer();
    peer = pe;
    pe.on('open', () => {
      if (host) { pe.on('connection', hostOnConnection); finish('ok'); return; }
      guestOpen();
      const t0 = Date.now();
      wait = setInterval(() => { if (hostConn && hostConn.open) finish('ok'); else if (Date.now() - t0 > 12000) finish('timeout'); }, 100);
    });
    pe.on('error', err => {
      const t = err && err.type;
      if (!done) { finish(t === 'unavailable-id' ? 'taken' : t === 'peer-unavailable' ? 'nohost' : 'neterr'); return; }
      if (!host && t === 'peer-unavailable') { hostConn = null; lostHost(); }
    });
    pe.on('disconnected', () => { if (!leaving && peer === pe) { try { pe.reconnect(); } catch (e) {} } });
  });
}
// immediate teardown (errors, menu)
function disconnect() {
  leaving = true;
  try { if (hostConn) hostConn.close(); } catch (e) {}
  for (const c of guestConns.values()) { try { c.close(); } catch (e) {} }
  guestConns.clear();
  try { if (peer) peer.destroy(); } catch (e) {}
  peer = null; hostConn = null; players = {}; isHost = false;
}
// leaving on purpose: the host closes the room for everyone, a guest gives up their place
function leaveRoom() {
  if (peer) { if (isHost) broadcast({ t: 'closed' }); else sendTo(hostConn, { t: 'bye' }); }
  forgetRoom();
  const pe = peer, conns = [...guestConns.values()], hc = hostConn;
  leaving = true; peer = null; hostConn = null; guestConns.clear(); players = {}; isHost = false; code = '';
  setTimeout(() => { for (const c of conns) { try { c.close(); } catch (e) {} } try { hc && hc.close(); } catch (e) {} try { pe && pe.destroy(); } catch (e) {} }, 400);
}

// ======================= MENU / UI =======================
function idleTick() {
  drawWorld(speed); drawDino(false);
  text('DINO', 62, 4, T.text); text('RUN', 100, 3, selColor);
}
function tick() {
  const edge = jumpEdge; jumpEdge = false;
  g.save();
  try {
    g.beginPath(); g.arc(CX, CY, 120, 0, Math.PI*2); g.clip();
    if (mode === 'solo') soloTick(edge);
    else if (mode === 'race' && state !== 'IDLE') raceTick(edge);
    else idleTick();
  } catch (e) { console.error(e); }      // one bad frame must never freeze the game
  finally { g.restore(); g.globalAlpha = 1; }
}

// Character + colour picker. Used in the menu, the race setup and the race lobby.
function pickerCard() {
  const card = el('div', { className: 'card' }), chars = el('div', { className: 'chars' }), colors = el('div', { className: 'colors' });
  card.append(el('h3', { textContent: 'בחר דמות' }), chars, colors);

// In a race room, tell everybody about the new look.
function lookChanged() {

    players[myId].char = selChar;

}
function newCode() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }

function enterRoom(restore) {
  lastResults = null; lastRoomSig = ''; phase = 'lobby';
  if (isHost) {

    if (restore && Array.isArray(restore.players)) {
      for (const q of restore.players) {
        const id = cleanId(q.id);
        if (id) players[id] = newPlayer(id, { name: cleanName(q.name) || 'PLAYER', color: COLORS.includes(q.color) ? q.color : COLORS[1],
          char: CHARS.some(c => c.id === q.char) ? q.char : 'dino', pts: +q.pts || 0, p1: +q.p1 || 0, p2: +q.p2 || 0, p3: +q.p3 || 0,
          awards: Array.isArray(q.awards) ? q.awards.filter(a => typeof a === 'string').slice(0, 50) : [], online: false });
      }

  show(pad, true); updateBack();
  saveRoom(); renderRoomPanel();
}

        : 'מחכים שהמארח יתחיל.' })]));

        textContent: familyMode ? '👨‍👩‍👧 משחק משפחה: פעיל ✓' : '👨‍👩‍👧 משחק משפחה: כבוי' });
      t.onclick = () => { familyMode = !familyMode; sendRoster(); };
      panel.append(t, el('div', { className: 'note', textContent: 'במשחק משפחה כל אחד זוכה בכל שלב בפרס אחר (הכי מהיר, הכי זהיר, מלך הקפיצות...), כולם מקבלים אותן נקודות — ואין ריבים 🙂' }));
    } else if (familyMode) panel.append(el('div', { className: 'card note', textContent: '👨‍👩‍👧 משחק משפחה: בכל שלב כל אחד זוכה בפרס אחר!' }));
    panel.append(pickerCard());
  }
  if (familyMode) { renderFamilyTable(); return; }
  const showResults = lastResults && (phase === 'results' || phase === 'final');
  const card = el('div', { className: 'card' });
  card.append(el('h3', { textContent: phase === 'final' ? '🏆 טבלה סופית' : showResults ? `אחרי שלב ${lastResults.level}` : `שחקנים (${onlineCount()}/${MAX_PLAYERS})` }));
  const tbl = el('table');
  tbl.append(el('tr', {}, [el('th', { textContent: '#' }), el('th', { textContent: 'שחקן' }),
    el('th', { textContent: showResults ? 'בשלב' : '' }), el('th', { textContent: 'נק׳' }), el('th', { className: 'n', textContent: '🥇🥈🥉' })]));
  standings().forEach((p, i) => {
    const row = showResults ? lastResults.rows.find(r => r.id === p.id) : null;
    const lvl = row ? (row.place > 0 ? `${row.place} (+${row.got})` : row.place === 0 ? 'לא סיים' : '—') : '';
    const nameCell = el('td', {}, [el('span', { className: 'dot', style: `background:${p.color}` }), document.createTextNode(charEmoji(p.char) + ' ' + (p.name || 'PLAYER') + (p.id === myId ? ' (אתה)' : '') + (p.online === false ? ' 💤' : ''))]);
    tbl.append(el('tr', { className: p.id === myId ? 'me' : '' }, [el('td', { className: 'n', textContent: i + 1 }), nameCell,
      el('td', { className: 'n', textContent: lvl }), el('td', { className: 'n', textContent: p.pts }), el('td', { className: 'n', textContent: `${p.p1}·${p.p2}·${p.p3}` })]));
  });
  card.append(tbl);
  panel.append(card);
}

function renderFamilyTable() {
  const showResults = lastResults && lastResults.family && (phase === 'results' || phase === 'final');
  const card = el('div', { className: 'card' });
  card.append(el('h3', { textContent: phase === 'final' ? '🎉 כולם ניצחו — הפרסים של כולם' : showResults ? `🏆 הפרסים של שלב ${lastResults.level}` : `שחקנים (${onlineCount()}/${MAX_PLAYERS}) · משחק משפחה` }));
  const tbl = el('table');
  tbl.append(el('tr', {}, [el('th', { textContent: 'שחקן' }), el('th', { textContent: showResults && phase !== 'final' ? 'הפרס בשלב' : '' }), el('th', { textContent: 'כל הפרסים' })]));
  const list = Object.values(players).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  for (const p of list) {
    const row = showResults ? lastResults.rows.find(r => r.id === p.id) : null;
    const a = row && row.award ? awardById(row.award) : null;
    const nameCell = el('td', {}, [el('span', { className: 'dot', style: `background:${p.color}` }), document.createTextNode(charEmoji(p.char) + ' ' + (p.name || 'PLAYER') + (p.id === myId ? ' (אתה)' : '') + (p.online === false ? ' 💤' : ''))]);
    tbl.append(el('tr', { className: p.id === myId ? 'me' : '' }, [nameCell,
      el('td', { textContent: a && phase !== 'final' ? a.emoji + ' ' + a.name : '' }), el('td', { textContent: awardSummary(p.awards) })]));
  }
  card.append(tbl);
  panel.append(card);
}

let backArmed = null;
function inRoom() { return mode === 'race' && state !== 'IDLE' && state !== 'RCLOSED' && !!code && !leaving; }
function updateBack() {
  clearTimeout(backArmed); backArmed = null;
  show(back, mode !== 'menu');
  back.textContent = inRoom() ? (isHost ? '✕ סגור חדר' : '✕ צא מהחדר') : '→ תפריט';
}
back.onclick = () => {
  if (inRoom()) {
    if (!backArmed) {                                        // ask once more, so nobody closes the room by accident
      back.textContent = isHost ? 'לחץ שוב — החדר ייסגר לכולם' : 'לחץ שוב כדי לצאת';
      backArmed = setTimeout(updateBack, 3000); return;
    }
    leaveRoom();
  } else disconnect();
  renderMenu();
};

// fixed 28ms step
let acc = 0, last = performance.now();
function step(t, maxGap) {
  acc += Math.min(Math.max(t - last, 0), maxGap); last = t;
  while (acc >= 28) { now += 28; tick(); acc -= 28; }
}
function frame(t) { step(t, 200); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
// When the page is in the background the browser pauses animation frames. Keep the
// game clock (and the host's job of running the race) ticking as well as the browser allows.
setInterval(() => { if (document.hidden) step(performance.now(), 1000); }, 250);

// keep the screen on while playing
let wakeLock = null;
async function keepAwake() { try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && mode !== 'menu') keepAwake(); });
renderMenu();

// ---- input ----
// Every finger is tracked by its id. A finger counts as released wherever it is lifted
// (even after sliding off the button or the screen), and everything is released when
// the page loses focus. Before this, a finger that slid off the round screen left the
// jump "held" forever and the character kept jumping.
const jumpPtrs = new Set(), duckPtrs = new Set();
let keyJump = false, keyDuck = false, pressAt = -1e9;
function refreshInput() {
  const j = jumpPtrs.size > 0 || keyJump, dn = duckPtrs.size > 0 || keyDuck;
  if (j && !input.jump) { jumpEdge = true; pressAt = now; }
  input.jump = j; input.duck = dn;
  $('jump').classList.toggle('on', j); $('duck').classList.toggle('on', dn);
}
function releaseAll() { jumpPtrs.clear(); duckPtrs.clear(); keyJump = keyDuck = false; refreshInput(); }
function bindPress(e0, set, allowed) {
  e0.addEventListener('pointerdown', e => {
    if (allowed && !allowed()) return;
    e.preventDefault();
    try { e0.setPointerCapture(e.pointerId); } catch (_) {}
    set.add(e.pointerId); refreshInput();
  });
  e0.addEventListener('contextmenu', e => e.preventDefault());
}
bindPress($('jump'), jumpPtrs); bindPress($('duck'), duckPtrs);
bindPress(cv, jumpPtrs, () => mode !== 'menu');
const lift = e => { if (jumpPtrs.delete(e.pointerId) | duckPtrs.delete(e.pointerId)) refreshInput(); };
addEventListener('pointerup', lift, true);
addEventListener('pointercancel', lift, true);
addEventListener('touchend', e => { if (e.touches.length === 0 && (jumpPtrs.size || duckPtrs.size)) { jumpPtrs.clear(); duckPtrs.clear(); refreshInput(); } }, true);
addEventListener('touchcancel', e => { if (e.touches.length === 0) { jumpPtrs.clear(); duckPtrs.clear(); refreshInput(); } }, true);
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
addEventListener('keydown', e => {
  if (e.repeat || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); keyJump = true; refreshInput(); }
  if (e.code === 'ArrowDown') { e.preventDefault(); keyDuck = true; refreshInput(); }
});
addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { keyJump = false; refreshInput(); }
  if (e.code === 'ArrowDown') { keyDuck = false; refreshInput(); }
});

// reopen a saved room when the page loads (after a reload, or the browser was closed)
(function resumeRoom() {
  const r = savedRoom();
  if (!r) return;
  renderRaceSetup();
  if (r.name) $('iName').value = r.name;
  $('iCode').value = r.code.toUpperCase();
  startRoom(r.code, !!r.host, r);
})();
</script>
